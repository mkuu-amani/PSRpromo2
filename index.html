<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================
   CLICKABLE FULL-SCREEN AREA
   ========================================= */

.promo-link {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    display: block;

    overflow: hidden;

    text-decoration: none;

    background: #000;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;
}

/* =========================================
   VIDEO STAGE
   ========================================= */

.stage {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}

/* =========================================
   BACKGROUND VIDEO
   ========================================= */

.background-video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center center;

    display: block;

    background: #000;
}

/* =========================================
   DARK CINEMATIC OVERLAY
   ========================================= */

.video-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.18) 0%,
            rgba(0,0,0,0.08) 40%,
            rgba(0,0,0,0.38) 100%
        );

    pointer-events: none;
}

/* =========================================
   GOLDEN SUN GLOW
   ========================================= */

.sun-glow {
    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 900px;
    max-height: 900px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: radial-gradient(
        circle,
        rgba(236,204,104,0.14) 0%,
        rgba(236,204,104,0.06) 35%,
        rgba(236,204,104,0) 70%
    );

    pointer-events: none;

    animation: glowPulse 6s ease-in-out infinite;
}

@keyframes glowPulse {

    0%,
    100% {
        opacity: 0.65;
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
    }
}

/* =========================================
   HEAT / SHIMMER
   ========================================= */

.heat {
    position: absolute;
    inset: -10%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,214,120,0.06),
            transparent 55%
        );

    opacity: 0.55;

    mix-blend-mode: screen;

    animation: heatMove 8s ease-in-out infinite;

    pointer-events: none;
}

@keyframes heatMove {

    0%,
    100% {
        transform: translate3d(-1%, 0, 0) scale(1);
    }

    50% {
        transform: translate3d(1%, -1%, 0) scale(1.03);
    }
}

/* =========================================
   EMBERS
   ========================================= */

.embers {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.ember {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(236,204,104,0.8);

    box-shadow:
        0 0 6px rgba(236,204,104,0.7),
        0 0 12px rgba(236,204,104,0.3);

    animation: rise linear infinite;
}

@keyframes rise {

    0% {
        transform: translate3d(0, 110vh, 0);
        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    90% {
        opacity: 0.5;
    }

    100% {
        transform: translate3d(30px, -10vh, 0);
        opacity: 0;
    }
}

/* =========================================
   TAP TO LISTEN
   ========================================= */

.visit-hint {
    position: absolute;

    left: 50%;
    bottom: clamp(24px, 5vh, 55px);

    transform: translateX(-50%);

    padding: 10px 20px;

    color: rgba(255,255,255,0.92);

    font-size: clamp(12px, 1.5vw, 16px);

    letter-spacing: 0.12em;

    text-transform: uppercase;

    white-space: nowrap;

    background: rgba(0,0,0,0.35);

    border: 1px solid rgba(236,204,104,0.35);

    border-radius: 30px;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    text-shadow:
        0 1px 5px rgba(0,0,0,0.8);

    animation: hintPulse 3s ease-in-out infinite;

    pointer-events: none;
}

@keyframes hintPulse {

    0%,
    100% {
        opacity: 0.65;
    }

    50% {
        opacity: 1;
    }
}

/* =========================================
   TABLET
   ========================================= */

@media (max-width: 900px) {

    .sun-glow {
        width: 100vw;
        height: 100vw;
    }

}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 600px) {

    .background-video {
        object-position: center center;
    }

    .video-overlay {
        background:
            linear-gradient(
                180deg,
                rgba(0,0,0,0.20) 0%,
                rgba(0,0,0,0.08) 45%,
                rgba(0,0,0,0.45) 100%
            );
    }

    .sun-glow {
        width: 130vw;
        height: 130vw;
    }

    .visit-hint {
        bottom: max(22px, env(safe-area-inset-bottom));

        font-size: 11px;

        padding: 9px 16px;

        letter-spacing: 0.10em;
    }

}

/* =========================================
   REDUCED MOTION
   ========================================= */

@media (prefers-reduced-motion: reduce) {

    .sun-glow,
    .heat,
    .visit-hint,
    .ember {
        animation: none !important;
    }

}

</style>
</head>

<body>

<a
    class="promo-link"
    href="https://www.prodigalsunradio.com/"
    aria-label="Listen to Prodigal Sun Radio"
>

    <div class="stage">

        <!-- VIDEO IS THE ONLY VISUAL BACKGROUND -->
        <video
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >
            <source src="background.mp4" type="video/mp4">
        </video>

        <div class="video-overlay"></div>

        <div class="sun-glow"></div>

        <div class="heat"></div>

        <div class="embers"></div>

        <div class="visit-hint">
            Tap to listen live
        </div>

    </div>

</a>

<script>

/* =========================================
   ANIMATED EMBERS
   ========================================= */

const emberContainer = document.querySelector('.embers');

const emberCount = 24;

for (let i = 0; i < emberCount; i++) {

    const ember = document.createElement('span');

    ember.className = 'ember';

    ember.style.left = Math.random() * 100 + '%';

    ember.style.animationDuration =
        (6 + Math.random() * 8) + 's';

    ember.style.animationDelay =
        (Math.random() * 8) + 's';

    const size =
        1.5 + Math.random() * 3;

    ember.style.width = size + 'px';
    ember.style.height = size + 'px';

    emberContainer.appendChild(ember);
}

</script>

</body>
</html>
