<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
    }

    body {
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
    }

    /* ENTIRE PAGE IS CLICKABLE */
    .promo-link {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
    }

    /* MAIN STAGE */
    .stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
    }

    /* FULL-SCREEN LOOPING VIDEO */
    .background-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        pointer-events: none;
        transform: scale(1.03);
        animation: videoDrift 24s ease-in-out infinite alternate;
    }

    /* ATMOSPHERIC DARKENING */
    .video-overlay {
        position: absolute;
        inset: 0;
        background:
            linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.16) 0%,
                rgba(0, 0, 0, 0.04) 35%,
                rgba(0, 0, 0, 0.40) 100%
            );
        pointer-events: none;
    }

    /* GOLDEN GLOW */
    .sun-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(
                circle at 50% 38%,
                rgba(255, 196, 70, 0.28) 0%,
                rgba(255, 140, 0, 0.08) 28%,
                transparent 55%
            );
        mix-blend-mode: screen;
        animation: pulse 6s ease-in-out infinite;
    }

    /* HEAT / ATMOSPHERE */
    .heat {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            linear-gradient(
                180deg,
                rgba(255, 170, 40, 0.08),
                transparent 35%,
                rgba(0, 0, 0, 0.18)
            );
        mix-blend-mode: soft-light;
        animation: shimmer 9s ease-in-out infinite;
    }

    /* FLOATING EMBERS */
    .embers {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .ember {
        position: absolute;
        bottom: -8px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffd36a;
        box-shadow:
            0 0 8px 3px rgba(255, 180, 40, 0.65);
        opacity: 0;
        animation: rise linear infinite;
    }

    /* LISTEN HINT */
    .visit-hint {
        position: fixed;
        left: 50%;
        bottom: max(1.25rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 0.55rem 1rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.65);
        color: #f5d76e;
        font-size: 0.85rem;
        letter-spacing: 0.03em;
        pointer-events: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 10;
        white-space: nowrap;
    }

    /* SUBTLE VIDEO MOVEMENT */
    @keyframes videoDrift {
        from {
            transform: scale(1.03) translate3d(-0.5%, 0, 0);
        }

        to {
            transform: scale(1.08) translate3d(0.5%, -0.5%, 0);
        }
    }

    /* GLOW PULSE */
    @keyframes pulse {
        0%,
        100% {
            opacity: 0.55;
        }

        50% {
            opacity: 1;
        }
    }

    /* HEAT SHIMMER */
    @keyframes shimmer {
        0%,
        100% {
            opacity: 0.45;
        }

        50% {
            opacity: 0.85;
        }
    }

    /* EMBER RISE */
    @keyframes rise {
        0% {
            transform: translate3d(0, 0, 0) scale(0.6);
            opacity: 0;
        }

        12% {
            opacity: 0.9;
        }

        100% {
            transform:
                translate3d(var(--drift), -110vh, 0)
                scale(0.2);
            opacity: 0;
        }
    }

    /* REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
        .background-video,
        .sun-glow,
        .heat,
        .ember {
            animation: none !important;
        }
    }
</style>

<a

    <div class="stage">

        <!-- LOOPING VIDEO BACKGROUND -->
        <video
            class="background-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            aria-hidden="true"
        >
            <source src="background.mp4" type="video/mp4">
        </video>

        <!-- VIDEO OVERLAY -->
        <div class="video-overlay"></div>

        <!-- ATMOSPHERIC EFFECTS -->
        <div class="sun-glow"></div>
        <div class="heat"></div>

        <!-- FLOATING EMBERS -->
        <div class="embers" id="embers"></div>

    </div>

</a>

<!-- LISTEN PROMPT -->
<div class="visit-hint">
    Tap to listen live
</div>

<script>
    const layer = document.getElementById('embers');

    const count = 22;

    for (let i = 0; i < count; i += 1) {

        const spark = document.createElement('span');

        spark.className = 'ember';

        spark.style.left =
            Math.random() * 100 + '%';

        spark.style.setProperty(
            '--drift',
            (Math.random() * 80 - 40) + 'px'
        );

        spark.style.animationDuration =
            (7 + Math.random() * 8) + 's';

        spark.style.animationDelay =
            (-Math.random() * 12) + 's';

        spark.style.width =
            spark.style.height =
            (2 + Math.random() * 5) + 'px';

        layer.appendChild(spark);
    }
</script>
