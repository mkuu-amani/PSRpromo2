<style>

    /* =========================================================
       BASE
    ========================================================= */

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: #000;
    }

    body {
        overflow: hidden;
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        /* Helps prevent unwanted touch behaviour */
        touch-action: manipulation;
    }


    /* =========================================================
       FULL SCREEN CLICKABLE AREA
    ========================================================= */

    .promo-link {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        width: 100vw;
        height: 100vh;

        /* Modern mobile viewport */
        height: 100dvh;

        display: block;

        cursor: pointer;

        text-decoration: none;
        color: inherit;

        overflow: hidden;
    }


    /* =========================================================
       MAIN STAGE
    ========================================================= */

    .stage {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #000;
    }


    /* =========================================================
       VIDEO
       
       The video is now the ONLY visual background.
    ========================================================= */

    .background-video {
        position: absolute;

        top: 50%;
        left: 50%;

        width: 100%;
        height: 100%;

        /*
         * cover makes the video fill the entire browser
         * without black bars.
         */
        object-fit: cover;

        object-position: center center;

        /*
         * Centre the video precisely inside the viewport.
         */
        transform: translate3d(-50%, -50%, 0);

        display: block;

        margin: 0;
        padding: 0;

        border: 0;

        pointer-events: none;

        background: #000;
    }


    /* =========================================================
       VIDEO OVERLAY
       
       Very subtle darkening to give the effects some depth.
    ========================================================= */

    .video-overlay {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        background:
            linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.12) 0%,
                rgba(0, 0, 0, 0.02) 40%,
                rgba(0, 0, 0, 0.38) 100%
            );
    }


    /* =========================================================
       GOLDEN GLOW
    ========================================================= */

    .sun-glow {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        background:
            radial-gradient(
                circle at 50% 38%,
                rgba(255, 196, 70, 0.28) 0%,
                rgba(255, 140, 0, 0.08) 28%,
                transparent 55%
            );

        mix-blend-mode: screen;

        animation:
            pulse 6s ease-in-out infinite;
    }


    /* =========================================================
       ATMOSPHERIC HEAT
    ========================================================= */

    .heat {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        background:
            linear-gradient(
                180deg,
                rgba(255, 170, 40, 0.08),
                transparent 35%,
                rgba(0, 0, 0, 0.18)
            );

        mix-blend-mode: soft-light;

        animation:
            shimmer 9s ease-in-out infinite;
    }


    /* =========================================================
       FLOATING EMBERS
    ========================================================= */

    .embers {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        overflow: hidden;
    }

    .ember {
        position: absolute;

        bottom: -8px;

        width: 5px;
        height: 5px;

        border-radius: 50%;

        background: #ffd36a;

        box-shadow:
            0 0 8px 3px rgba(255, 180, 40, 0.65);

        opacity: 0;

        animation:
            rise linear infinite;
    }


    /* =========================================================
       LISTEN PROMPT
    ========================================================= */

    .visit-hint {
        position: fixed;

        left: 50%;

        bottom:
            max(
                1.25rem,
                env(safe-area-inset-bottom)
            );

        transform: translateX(-50%);

        padding:
            0.55rem 1rem;

        border-radius: 999px;

        background:
            rgba(0, 0, 0, 0.65);

        color: #f5d76e;

        font-size: 0.85rem;

        letter-spacing: 0.03em;

        pointer-events: none;

        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);

        z-index: 10;

        white-space: nowrap;
    }


    /* =========================================================
       GLOW PULSE
    ========================================================= */

    @keyframes pulse {

        0%,
        100% {
            opacity: 0.55;
        }

        50% {
            opacity: 1;
        }

    }


    /* =========================================================
       HEAT SHIMMER
    ========================================================= */

    @keyframes shimmer {

        0%,
        100% {
            opacity: 0.45;
        }

        50% {
            opacity: 0.85;
        }

    }


    /* =========================================================
       EMBER RISE
    ========================================================= */

    @keyframes rise {

        0% {
            transform:
                translate3d(0, 0, 0)
                scale(0.6);

            opacity: 0;
        }

        12% {
            opacity: 0.9;
        }

        100% {
            transform:
                translate3d(
                    var(--drift),
                    -110vh,
                    0
                )
                scale(0.2);

            opacity: 0;
        }

    }


    /* =========================================================
       MOBILE PORTRAIT
       
       Still uses cover, but keeps the centre of the video.
    ========================================================= */

    @media (max-width: 600px) {

        .background-video {
            object-position: center center;
        }

        .visit-hint {
            font-size: 0.8rem;

            padding:
                0.5rem 0.9rem;
        }

    }


    /* =========================================================
       TABLET / LANDSCAPE
    ========================================================= */

    @media (min-width: 601px) {

        .background-video {
            object-position: center center;
        }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        .sun-glow,
        .heat,
        .ember {
            animation: none !important;
        }

    }

</style>

            <source
                src="background.mp4"
                type="video/mp4"
            >

        </video>


        <!-- VIDEO DARKENING -->

        <div class="video-overlay"></div>


        <!-- GOLDEN ATMOSPHERE -->

        <div class="sun-glow"></div>


        <!-- HEAT / SHIMMER -->

        <div class="heat"></div>

            class="embers"
            id="embers"
        ></div>


    </div>

<!-- =========================================================
     LISTEN PROMPT
========================================================= -->

<div class="visit-hint">
    Tap to listen live
</div>


<!-- =========================================================
     EMBER GENERATOR
========================================================= -->

<script>

    const layer =
        document.getElementById('embers');

    const count = 22;


    for (
        let i = 0;
        i < count;
        i += 1
    ) {

        const spark =
            document.createElement('span');


        spark.className =
            'ember';


        spark.style.left =
            Math.random() * 100 + '%';


        spark.style.setProperty(
            '--drift',
            (Math.random() * 80 - 40) + 'px'
        );


        spark.style.animationDuration =
            (7 + Math.random() * 8) + 's';


        spark.style.animationDelay =
            (-Math.random() * 12) + 's';


        const size =
            2 + Math.random() * 5;


        spark.style.width =
            size + 'px';


        spark.style.height =
            size + 'px';


        layer.appendChild(spark);

    }

</script>
